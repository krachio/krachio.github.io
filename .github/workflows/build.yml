name: Build site

on:
  push:
    branches: [main]
    paths: ['index.md', 'template.html', 'Makefile', '*.css']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y pandoc
      - run: make clean && make
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "rebuild: index.html from updated index.md"
          file_pattern: index.html
